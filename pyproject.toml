[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfdelta"
version = "0.1.4"
description = "Visual PDF diff for academic papers, optimized for paper revisions"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "pdf diff",
    "visual PDF diff",
    "compare PDFs",
    "PDF comparison",
    "academic paper revision",
    "LaTeX PDF diff",
    "born-digital PDF",
    "document comparison",
    "visual change tracking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: General",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyMuPDF>=1.24",
]

[project.scripts]
pdfdelta = "pdfdelta.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/mli55/pdfdelta"
Repository = "https://github.com/mli55/pdfdelta"
Issues = "https://github.com/mli55/pdfdelta/issues"
Changelog = "https://github.com/mli55/pdfdelta/releases"
